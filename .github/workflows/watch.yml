name: Eurostar Snap watcher

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # toutes les 15 min, décalé des heures pleines où GitHub est saturé
  workflow_dispatch:
    inputs:
      outbound:
        description: "TEST uniquement : date aller (AAAA-MM-JJ). Vide = celle de config.json"
        required: false
      inbounds:
        description: "TEST uniquement : dates retour séparées par des virgules. Vide = celles de config.json"
        required: false

# Un seul run à la fois (cron-job.org + cron GitHub) pour éviter les issues en double.
concurrency:
  group: snap-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier les disponibilités
        run: python3 watch.py
        env:
          OUTBOUND: ${{ inputs.outbound }}
          INBOUNDS: ${{ inputs.inbounds }}

      - name: Ouvrir une issue par nouveau créneau disponible
        uses: actions/github-script@v8
        with:
          script: |
            const found = JSON.parse(require('fs').readFileSync('found.json', 'utf8'));
            if (!found.length) return;

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100,
            });
            const titles = new Set(existing.map(i => i.title));

            for (const f of found) {
              const prefix = '${{ inputs.outbound }}${{ inputs.inbounds }}' ? '[TEST] ' : '';
              const title = `${prefix}Snap dispo : ${f.direction} ${f.earliest.slice(0, 10)} départ ${f.departure} (train ${f.train})`;
              if (titles.has(title)) continue;  // déjà notifié
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title,
                assignees: [context.repo.owner],  // assigner + mentionner déclenche un mail (réglages GitHub par défaut)
                body: [
                  `@${context.repo.owner} 🚄 nouveau créneau Snap !`,
                  '',
                  `**${f.direction}** le ${f.earliest.slice(0, 10)}`,
                  `🕐 **Départ ${f.departure} → arrivée ${f.arrival}** (train Eurostar ${f.train})`,
                  `Créneau Snap à choisir : ${f.earliest.slice(11)}–${f.latest.slice(11)}`,
                  '',
                  f.adults > 1
                    ? `Prix : **${f.price} € pour ${f.adults} adultes** (${f.price_per_adult} €/pers., ${f.seats} places restantes)`
                    : `Prix : **${f.price} €** (${f.seats} places restantes)`,
                  '',
                  `👉 [Réserver sur Snap](${f.url})`,
                ].join('\n'),
              });
              core.notice(`Issue créée : ${title}`);
            }
