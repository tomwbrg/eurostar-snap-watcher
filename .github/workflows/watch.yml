name: Eurostar Snap watcher

on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 min, décalé des heures pleines où GitHub est saturé
  workflow_dispatch:
    inputs:
      outbound:
        description: "TEST uniquement : date aller (AAAA-MM-JJ). Laisser vide = 23/10"
        required: false
      inbounds:
        description: "TEST uniquement : dates retour séparées par des virgules. Laisser vide = 25/10,26/10"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier les disponibilités
        run: python3 watch.py
        env:
          OUTBOUND: ${{ inputs.outbound }}
          INBOUNDS: ${{ inputs.inbounds }}

      - name: Ouvrir une issue par nouveau créneau disponible
        uses: actions/github-script@v8
        with:
          script: |
            const found = JSON.parse(require('fs').readFileSync('found.json', 'utf8'));
            if (!found.length) return;

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100,
            });
            const titles = new Set(existing.map(i => i.title));

            for (const f of found) {
              const prefix = '${{ inputs.outbound }}' ? '[TEST] ' : '';
              const title = `${prefix}Snap dispo : ${f.direction} ${f.earliest} – ${f.latest.slice(11)}`;
              if (titles.has(title)) continue;  // déjà notifié
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title,
                assignees: [context.repo.owner],  // assigner + mentionner déclenche un mail (réglages GitHub par défaut)
                body: [
                  `@${context.repo.owner} 🚄 nouveau créneau Snap !`,
                  '',
                  `**${f.direction}**, départ entre ${f.earliest} et ${f.latest}`,
                  '',
                  `Prix : **${f.price} €** (${f.seats} places restantes)`,
                  '',
                  `👉 [Réserver sur Snap](${f.url})`,
                ].join('\n'),
              });
              core.notice(`Issue créée : ${title}`);
            }
